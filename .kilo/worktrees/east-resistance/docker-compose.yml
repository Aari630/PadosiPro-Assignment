version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: padosipro-postgres
    restart: always
    environment:
      POSTGRES_USER: padosi_user
      POSTGRES_PASSWORD: padosi_password
      POSTGRES_DB: padosipro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padosi_user -d padosipro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: padosipro-mailpit
    restart: always
    ports:
      - "1025:1025"   # SMTP port
      - "8025:8025"   # Web UI dashboard
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data: